<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#fff4c2" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#ffcf5a" stop-opacity=".55"/>
      <stop offset=".62" stop-color="#ff9d2e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2233"/>
      <stop offset="1" stop-color="#141216"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#ffd877"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- rays of light from the centre -->
    <g fill="#ffe08a" opacity=".22" transform="translate(32 30)">
      <path d="M-1.4 0 L0 -40 L1.4 0Z"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(30)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(-30)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(60)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(-60)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(90)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(-90)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(120)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(-120)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(150)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(-150)"/>
      <path d="M-1.4 0 L0 -40 L1.4 0Z" transform="rotate(180)"/>
    </g>
    <circle cx="32" cy="30" r="34" fill="url(#halo)"/>
  </g>
  <!-- the selection, lit like a doorway -->
  <rect x="26" y="8" width="18" height="48" rx="3" fill="#ffd36b" opacity=".28"/>
  <g filter="url(#glow)">
    <g fill="url(#bar)">
      <rect x="9" y="27" width="4" height="10" rx="2"/>
      <rect x="16" y="20" width="4" height="24" rx="2"/>
      <rect x="23" y="14" width="4" height="36" rx="2"/>
      <rect x="30" y="22" width="4" height="20" rx="2"/>
      <rect x="37" y="11" width="4" height="42" rx="2"/>
      <rect x="44" y="19" width="4" height="26" rx="2"/>
      <rect x="51" y="25" width="4" height="14" rx="2"/>
    </g>
    <rect x="25" y="8" width="2.5" height="48" rx="1" fill="#ffb020"/>
    <rect x="42.5" y="8" width="2.5" height="48" rx="1" fill="#ffb020"/>
    <!-- sparkles -->
    <g fill="#fffbe8">
      <path d="M12 9 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1z"/>
      <path d="M53 47 l.8 2.2 l2.2 .8 l-2.2 .8 l-.8 2.2 l-.8 -2.2 l-2.2 -.8 l2.2 -.8z"/>
      <path d="M52 10 l.6 1.6 l1.6 .6 l-1.6 .6 l-.6 1.6 l-.6 -1.6 l-1.6 -.6 l1.6 -.6z"/>
    </g>
  </g>
</svg>
